    <text x="52" y="566" font-family="'Segoe Script', cursive" font-size="19" fill="#1b2a6b">Advice: low salt diet, walk daily</text>
    <text x="52" y="598" font-family="'Segoe Script', cursive" font-size="19" fill="#1b2a6b">Review after 3 months with BP chart</text>
