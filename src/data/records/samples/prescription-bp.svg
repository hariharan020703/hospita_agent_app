    <text x="330" y="160" font-family="Arial, sans-serif" font-size="14" fill="#333">Age/Sex: <tspan font-family="'Segoe Script', cursive" font-size="18" fill="#1b2a6b">51 / F</tspan></text>
    <text x="52" y="190" font-family="Arial, sans-serif" font-size="14" fill="#333">Date: <tspan font-family="'Segoe Script', cursive" font-size="18" fill="#1b2a6b">18/11/2025</tspan></text>
    <text x="330" y="190" font-family="Arial, sans-serif" font-size="14" fill="#333">BP: <tspan font-family="'Segoe Script', cursive" font-size="18" fill="#1b2a6b">156/96</tspan></text>
    <text x="52" y="236" font-family="'Segoe Script', cursive" font-size="20" fill="#1b2a6b">c/o headache, giddiness on and off</text>
