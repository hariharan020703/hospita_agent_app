    <text x="88" y="470" font-family="'Segoe Script', cursive" font-size="22" fill="#1b2a6b" opacity="0.72">2. Tab. Pan<tspan opacity="0.5">topr</tspan>azole 40</text>
    <text x="128" y="500" font-family="'Segoe Script', cursive" font-size="19" fill="#1b2a6b" opacity="0.72">1 - 0 - 0   before food  × 1 month</text>
