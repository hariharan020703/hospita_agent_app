<svg xmlns="http://www.w3.org/2000/svg" width="600" height="820" viewBox="0 0 600 820" role="img" aria-label="Sample discharge summary">
  <defs>
    <filter id="paper"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" result="n"/><feColorMatrix type="saturate" values="0"/><feBlend in="SourceGraphic" in2="n" mode="multiply"/></filter>
  </defs>
  <rect width="600" height="820" fill="#d5d0c5"/>
  <g transform="rotate(-0.6 300 410)">
    <rect x="30" y="24" width="540" height="772" fill="#fdfbf6" filter="url(#paper)"/>
    <text x="300" y="64" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#7a2e2e">SRI RAMANA HOSPITAL</text>
    <text x="300" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Ramanathapuram, Coimbatore 641045 · 24 hr Emergency 0422 231 0000</text>
    <line x1="50" y1="100" x2="550" y2="100" stroke="#7a2e2e" stroke-width="1.5"/>
    <text x="300" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#222">DISCHARGE SUMMARY</text>
    <g font-family="Arial, sans-serif" font-size="13" fill="#222">
      <text x="52" y="162">Patient: Mrs. Lakshmi Murugan · 50 Y / F</text>
      <text x="52" y="184">IP No: SRH/24/1187 · Ward: General (F)</text>
      <text x="52" y="206">Admitted: 10-06-2024 · Discharged: 14-06-2024</text>
      <text x="52" y="228">Consultant: Dr. S. Prabhu, MD</text>
      <text x="52" y="266" font-weight="bold">Final diagnosis:</text>
      <text x="52" y="288">Viral fever with dehydration. Dengue NS1 negative.</text>
      <text x="52" y="324" font-weight="bold">Course in hospital:</text>
      <text x="52" y="346">Treated with IV fluids and antipyretics. Platelets lowest 1.2 lakh,</text>
      <text x="52" y="368">1.4 lakh/µL at discharge (ref 1.5 - 4.5). Hb 12.1 g/dL (ref 12 - 15).</text>
      <text x="52" y="390">Afebrile for 48 hours before discharge. Taking oral feeds well.</text>
      <text x="52" y="428" font-weight="bold">Medicines on discharge:</text>
      <text x="64" y="452">1. Tab. Paracetamol 650 mg - when needed for fever, max 3 a day</text>
      <text x="64" y="474" opacity="0.7">2. ORS - 1 sachet in 1 litre water, sip through the day</text>
      <text x="52" y="512" font-weight="bold">Advice:</text>
      <text x="64" y="534">Plenty of oral fluids. Review in OPD after 1 week with CBC.</text>
      <text x="64" y="556">Return at once if bleeding, abdominal pain or persistent vomiting.</text>
    </g>
    <text x="400" y="690" font-family="'Segoe Script', cursive" font-size="22" fill="#1b2a6b">S. Prabhu</text>
    <line x1="380" y1="702" x2="540" y2="702" stroke="#555"/>
    <text x="460" y="722" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">Consultant</text>
  </g>
</svg>
